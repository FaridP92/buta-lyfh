# Backend Buta.Lyfh (et base RenovScope) sur le VPS : Postgres + PostgREST + Edge Functions sous Deno.
# Remplace le projet Supabase `renovscope` : même API (/rest/v1, /functions/v1) servie par nginx sur buta.lyfh.fr.
# Secrets dans .env (jamais versionné).
name: buta-backend

services:
  db:
    build: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      ANALYSTE_RO_PASSWORD: ${ANALYSTE_RO_PASSWORD}
    command: >
      postgres
      -c shared_preload_libraries=pg_cron,pg_stat_statements
      -c cron.database_name=buta
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
      -c shared_buffers=512MB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=60
      -c timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buta"]
      interval: 5s
      timeout: 5s
      retries: 30

  rest:
    image: postgrest/postgrest:v13.0.4
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/buta?sslmode=disable
      PGRST_DB_SCHEMAS: buta,analytics
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_OPENAPI_MODE: disabled
    ports:
      - "127.0.0.1:3011:3000"

  fn-analyste:
    image: denoland/deno:2.5.6
    restart: unless-stopped
    working_dir: /fn/analyste
    command: ["run", "-A", "--no-lock", "index.ts"]
    environment: &fn-env
      DENO_SERVE_ADDRESS: tcp:0.0.0.0:8000
      DENO_DIR: /deno-dir
      SUPABASE_URL: https://buta.lyfh.fr
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/buta
      SITE_ORIGINE: https://buta.lyfh.fr
      IA_SEL: ${IA_SEL}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "buta.lyfh.fr:${PUBLIC_IP}"
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./functions:/fn:ro
      - denocache:/deno-dir

  fn-expliquer-ecart:
    image: denoland/deno:2.5.6
    restart: unless-stopped
    working_dir: /fn/expliquer-ecart
    command: ["run", "-A", "--no-lock", "index.ts"]
    environment: *fn-env
    extra_hosts:
      - "buta.lyfh.fr:${PUBLIC_IP}"
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./functions:/fn:ro
      - denocache:/deno-dir

  gateway:
    image: denoland/deno:2.5.6
    restart: unless-stopped
    command: ["run", "--allow-net", "--allow-env", "/gw/gateway.ts"]
    environment:
      DENO_DIR: /deno-dir
      JWT_SECRET: ${JWT_SECRET}
      SITE_ORIGINE: https://buta.lyfh.fr
    volumes:
      - ./gateway:/gw:ro
      - denocache:/deno-dir
    ports:
      - "127.0.0.1:8110:8000"

volumes:
  pgdata:
  denocache:
